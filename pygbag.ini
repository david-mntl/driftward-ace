; pygbag build config. pygbag 0.9.3 reads it from its working directory, so build from the repo root.
; Leaves dev-only files out of the release package. Paths are relative to game/.
; Source: docs/contracts/DRA-5/DRA-5-app.md, Rules, Release package.
[DEPENDENCIES]
ignoreDirs = ["/tests", "/scripts", "/.ruff_cache", "/.pytest_cache", "__pycache__"]
ignoreFiles = ["CONTEXT.md", "requirements.txt", "ruff.toml"]
