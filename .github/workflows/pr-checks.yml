# Runs the QA gate and the browser build on every pull request to main and every push to main.
# Lint and tests run through game/tests/check.sh, the same command used locally.
# The wave check and the bot check run only the waves the change touched. Run `wave_check.py --all` (and `--all --bot`) locally for all.
# The contracts job runs scripts/contracts.sh verify on the whole history: it checks every contract hub and part, and proves again that no contract split lost a line.
# Actions are pinned to a commit SHA. The comment names the release.
name: PR checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: game/requirements.txt

      - name: Install pinned tools
        run: pip install -r game/requirements.txt

      - name: Run check.sh
        run: game/tests/check.sh

  build:
    name: Browser build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: game/requirements.txt

      - name: Install pinned tools
        run: pip install -r game/requirements.txt

      # pygbag reads pygbag.ini from its working directory, so this runs from the repo root.
      - name: Build web.zip
        run: python -m pygbag --archive game

      - name: Check the release package holds runtime files only
        run: python .github/scripts/check_release_package.py

  waves:
    name: Wave check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The whole history, so git can list what changed since the base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: game/requirements.txt

      - name: Install pinned tools
        run: pip install -r game/requirements.txt

      - name: Test wave_check
        working-directory: tools/wave_check
        run: python -m pytest -q

      # A pull request is compared with its base branch, a push with the commit before it.
      # --force and --no-record: a remembered pass never hides a failure, and nothing is written.
      - name: Check the changed waves
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: python tools/wave_check/wave_check.py --changed --base "$BASE" --force --no-record

      # The bot flies each changed wave from every start spot, about 10 to 20 s a wave.
      # It runs even when the step above fails, so one push shows both results.
      - name: Bot check the changed waves
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: python tools/wave_check/wave_check.py --changed --base "$BASE" --bot --force --no-record

  contracts:
    name: Contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The whole history: verify reads the old files of the contract splits from git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify the contracts
        run: scripts/contracts.sh verify
